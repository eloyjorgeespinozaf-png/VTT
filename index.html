  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registro de Service Worker para PWA (Fase 19)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[PWA-VTT] Service Worker registrado con éxito:', registration.scope);
            })
            .catch((error) => {
              console.error('[PWA-VTT] Fallo al registrar el Service Worker:', error);
            });
        });
      }
    </script>
  </body>
